[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "rstest"
version = "0.4.0"
description = "A fast, pytest-compatible test runner: parallel by design, with built-in suite diagnostics"
readme = "README.md"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
maintainers = [{ name = "Kovant AB" }]
requires-python = ">=3.10"
dependencies = [
    # worker protocol
    "msgpack>=1.0",
    # runtime deps of the vendored pytest core (python/VENDOR.md)
    "pluggy>=1.5,<2",
    "iniconfig",
    "packaging",
    "pygments>=2.7.2",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing",
]

[project.urls]
Documentation = "https://python-rstest.readthedocs.io/en/stable/"
Homepage = "https://python-rstest.readthedocs.io/en/stable/"
Repository = "https://github.com/KovantAI/rstest"
Changelog = "https://github.com/KovantAI/rstest/blob/main/CHANGELOG.md"
Issues = "https://github.com/KovantAI/rstest/issues"

[tool.maturin]
bindings = "bin"
manifest-path = "crates/rstest-cli/Cargo.toml"
python-source = "python"
module-name = "rstest_worker"

[dependency-groups]
# Dev tooling for the Python worker (installed with `uv sync --group dev`).
# The vendored pytest core ships in-tree; msgpack/coverage are worker runtime
# deps needed to import and exercise the worker under a real test session.
dev = [
    "msgpack>=1.0",
    "coverage>=7",
]

[tool.ruff]
# The vendored pytest core is third-party source; never lint or format it.
# e2e/toy and e2e/fixtures hold deliberately-broken suites (missing imports,
# crashing tests, doctest failures) that must not be linted or auto-fixed.
extend-exclude = ["python/rstest_worker/_vendor", "e2e/toy", "e2e/fixtures"]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Curated set: correctness + modernization + import hygiene, minus the
# opinionated rules that fight the worker's deliberate patterns (blind
# BaseException containment in _contained, dead-sibling cleanup swallowing in
# stream.py — both load-bearing and documented at the call site).
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# __main__ must manipulate sys.path before importing the worker package, so its
# imports intentionally sit below module-level statements.
"python/rstest_worker/__main__.py" = ["E402"]

[tool.ty.src]
# ty type-checks the worker package only; the vendored pytest core is excluded.
# e2e/toy holds deliberately-broken fixtures (e.g. a missing-import
# collect-error case) that must not be type-checked.
exclude = ["python/rstest_worker/_vendor", "e2e"]

[tool.pytest.ini_options]
# Worker unit tests (helpers that don't need the vendored pytest core). Run with
# a real pytest: `uvx --with msgpack pytest`. The end-to-end suite is separate
# (`python e2e/gate.py`, which drives the built rstest binary).
testpaths = ["python/tests"]
pythonpath = ["python"]
