[pytest]
# Persona specs: the Gherkin features in features/ are the source of truth for
# what each persona expects from rstest; steps/ binds them to the built binary.
# Run: uv run --group dev pytest e2e/personas [--binary target/release/rstest]
# (python e2e/gate.py runs this too, as its `personas` section).
addopts = --strict-markers -ra
xfail_strict = true
markers =
    known_bug: pins a current failure; xfails until the bug is fixed, then XPASS fails the run so the tag gets dropped
    posix_only: scenario depends on POSIX process or filesystem behaviour
    windows_only: scenario covers Windows-specific behaviour
    linux_only: scenario depends on Linux-only behaviour
    macos_only: scenario depends on macOS-only behaviour
