# Run with: pre-commit run --all-files
# Install once per clone: pre-commit install
# Update hooks: pre-commit autoupdate
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: check-yaml
        args: [--unsafe]
      - id: check-toml
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.5
    hooks:
      # Lint then format the Python worker (vendored pytest excluded via
      # pyproject [tool.ruff] extend-exclude).
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/astral-sh/ty-pre-commit
    rev: v0.0.75
    hooks:
      # Same env as the CI `ty` check (ci.yml): the worker imports pytest/_pytest
      # and msgpack, so ty needs them installed to resolve those imports.
      - id: ty
        additional_dependencies: [pytest, msgpack, coverage]

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.12.7
    hooks:
      # Fail if uv.lock drifts from pyproject.toml (matches the CI check).
      - id: uv-lock

  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all
        language: system
        types: [rust]
        pass_filenames: false

      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --all-targets --all-features -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false

      - id: cargo-check
        name: cargo check
        entry: cargo check --all-targets --all-features
        language: system
        types: [rust]
        pass_filenames: false
