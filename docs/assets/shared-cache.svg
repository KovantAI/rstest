<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The shared cache backend. Each run or shard pushes only its own immutable segment with --cache-push, so concurrent pushes never overwrite each other. The remote holds segments/seg-id.json files and a compacted base.json; cache-compact folds segments into the base and records their ids. A fresh runner's --cache-pull merges the base and every segment into its local .rstest_cache, per data type: durations keep the newest per test, flake counts are summed and deduplicated, the coverage index is unioned per file, scope costs keep the newest, run history is unioned by run id, and the green snapshot keeps the newest green one." viewBox="0 0 820 600">
<style>
svg { --ink: #1f2427; --muted: #6b7178; --line: #a0a5ab; --box: #f4f5f6; --chip: #ffffff; --accent: #00897b; --accent-bg: #e0f2f1; --bg: #ffffff; }
@media (prefers-color-scheme: dark) {
  svg { --ink: #e2e4e9; --muted: #9aa0a6; --line: #5c6370; --box: #2a2d36; --chip: #1e2129; --accent: #4db6ac; --accent-bg: #15302d; --bg: #1a1c22; }
}
text { fill: var(--ink); text-anchor: middle; font-family: Inter, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
.rs-title { font-size: 19px; font-weight: 700; }
.rs-sub { font-size: 14.5px; }
.rs-sm.rs-title { font-size: 17px; }
.rs-sm.rs-sub { font-size: 13.5px; }
.rs-label { fill: var(--muted); font-size: 12.5px; font-weight: 600; }
.rs-start { text-anchor: start; }
.rs-end { text-anchor: end; }
.rs-tag { fill: var(--accent); font-size: 12.5px; font-weight: 600; letter-spacing: 0.5px; }
.rs-bg { fill: var(--bg); }
.rs-box { fill: var(--box); stroke: var(--line); stroke-width: 1.5; }
.rs-hot { fill: var(--accent-bg); stroke: var(--accent); stroke-width: 2.5; }
.rs-loop { fill: var(--box); stroke: var(--accent); stroke-width: 2; stroke-dasharray: 7 5; }
.rs-chips rect { fill: var(--chip); stroke: var(--accent); }
.rs-chips text { font-size: 12px; font-weight: 600; }
.rs-row { fill: var(--chip); stroke: var(--line); stroke-width: 1; }
.rs-row-text { font-size: 13.5px; }
.rs-note { fill: var(--muted); font-size: 12.5px; }
.rs-bar { fill: var(--line); }
.rs-bar-hot { fill: var(--accent); }
.rs-dash { stroke: var(--muted); stroke-width: 1.5; stroke-dasharray: 4 4; fill: none; }
.rs-line, .rs-edge { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.rs-thin { stroke: var(--muted); stroke-width: 1.5; fill: none; }
.rs-edge { marker-end: url(#rs-arrow); }
.rs-edge.rs-accent { stroke: var(--accent); marker-end: url(#rs-arrow-accent); }
.rs-head { fill: var(--ink); }
.rs-head-accent { fill: var(--accent); }
</style>
<defs>
<marker id="rs-arrow" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path class="rs-head" d="M0 0L10 5L0 10"/></marker>
<marker id="rs-arrow-accent" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path class="rs-head-accent" d="M0 0L10 5L0 10"/></marker>
</defs>
<rect class="rs-bg" width="100%" height="100%" rx="16"/>
<rect class="rs-box" x="68" y="20" width="136" height="64" rx="12"/><text class="rs-title rs-sm" x="136" y="48">shard 1/2</text><text class="rs-note" x="136" y="70">--cache-push</text>
<rect class="rs-box" x="212" y="20" width="136" height="64" rx="12"/><text class="rs-title rs-sm" x="280" y="48">shard 2/2</text><text class="rs-note" x="280" y="70">--cache-push</text>
<rect class="rs-box" x="356" y="20" width="136" height="64" rx="12"/><text class="rs-title rs-sm" x="424" y="48">PR run</text><text class="rs-note" x="424" y="70">--cache-push</text>
<text class="rs-note rs-start" x="520" y="48">each run pushes only</text>
<text class="rs-note rs-start" x="520" y="66">the slice it measured</text>
<rect class="rs-box" x="40" y="124" width="740" height="210" rx="14"/>
<text class="rs-title rs-sm" x="662" y="156">Shared remote</text>
<text class="rs-note" x="662" y="178">dir, s3://, gs://, https://</text>
<rect class="rs-row" x="56" y="140" width="440" height="178" rx="10"/>
<line class="rs-edge" x1="136" y1="84" x2="136" y2="194"/>
<line class="rs-edge" x1="280" y1="84" x2="280" y2="194"/>
<line class="rs-edge" x1="424" y1="84" x2="424" y2="194"/>
<g class="rs-chips">
<rect x="72" y="194" width="128" height="40" rx="8"/><text x="136" y="219">seg-a1.json</text>
<rect x="216" y="194" width="128" height="40" rx="8"/><text x="280" y="219">seg-b2.json</text>
<rect x="360" y="194" width="128" height="40" rx="8"/><text x="424" y="219">seg-c3.json</text>
</g>
<text class="rs-note" x="276" y="270">segments/</text>
<text class="rs-note" x="276" y="290">one immutable segment per run or shard</text>
<line class="rs-edge rs-accent" x1="496" y1="256" x2="560" y2="256"/>
<text class="rs-label" x="528" y="246">compact</text>
<rect class="rs-box rs-hot" x="560" y="194" width="204" height="124" rx="12"/>
<text class="rs-title rs-sm" x="662" y="234">base.json</text>
<text class="rs-sub rs-sm" x="662" y="258">compacted merged state</text>
<text class="rs-note" x="662" y="282">plus the ids it absorbed</text>
<line class="rs-edge" x1="410" y1="334" x2="410" y2="392"/>
<text class="rs-label rs-start" x="420" y="368">--cache-pull: base plus every segment</text>
<rect class="rs-box rs-hot" x="40" y="392" width="740" height="188" rx="14"/>
<text class="rs-title rs-sm" x="410" y="424">Local .rstest_cache, merged per data type</text>
<rect class="rs-row" x="50" y="444" width="232" height="40" rx="8"/><text class="rs-row-text" x="166" y="469">durations: newest per test</text>
<rect class="rs-row" x="294" y="444" width="232" height="40" rx="8"/><text class="rs-row-text" x="410" y="469">flake counts: summed, deduped</text>
<rect class="rs-row" x="538" y="444" width="232" height="40" rx="8"/><text class="rs-row-text" x="654" y="469">coverage index: per-file union</text>
<rect class="rs-row" x="50" y="496" width="232" height="40" rx="8"/><text class="rs-row-text" x="166" y="521">scope costs: newest</text>
<rect class="rs-row" x="294" y="496" width="232" height="40" rx="8"/><text class="rs-row-text" x="410" y="521">run history: union by run id</text>
<rect class="rs-row" x="538" y="496" width="232" height="40" rx="8"/><text class="rs-row-text" x="654" y="521">green snapshot: newest</text>
<text class="rs-tag" x="410" y="564">PUSHES NEVER OVERWRITE EACH OTHER</text>
</svg>
