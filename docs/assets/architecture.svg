<text class="rs-title rs-sm" x="315" y="284">gw1</text>
<text class="rs-sub rs-sm" x="315" y="310">your interpreter</text>
<text class="rs-sub rs-sm" x="315" y="332">rstest_worker</text>
<text class="rs-sub rs-sm" x="315" y="354">vendored pytest core</text>
<rect class="rs-box" x="420" y="254" width="170" height="124" rx="14"/>
<text class="rs-title rs-sm" x="505" y="284">gw2</text>
<text class="rs-sub rs-sm" x="505" y="310">your interpreter</text>
<text class="rs-sub rs-sm" x="505" y="332">rstest_worker</text>
<text class="rs-sub rs-sm" x="505" y="354">vendored pytest core</text>
<rect class="rs-box" x="610" y="254" width="170" height="124" rx="14"/>
<text class="rs-title rs-sm" x="695" y="284">gwN</text>
<text class="rs-sub rs-sm" x="695" y="310">your interpreter</text>
<text class="rs-sub rs-sm" x="695" y="332">rstest_worker</text>
<text class="rs-sub rs-sm" x="695" y="354">vendored pytest core</text>
<rect class="rs-loop" x="40" y="398" width="740" height="84" rx="14"/>
<text class="rs-title rs-sm" x="410" y="430">Workers own everything about the tests</text>
<text class="rs-sub rs-sm" x="410" y="454">collection, fixtures, plugins, test execution</text>
<text class="rs-tag" x="410" y="474">STDIN AND STDOUT STAY WITH YOUR TESTS</text>
</svg>
