<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A parallel run in five steps. 1, spawn: N workers start in your interpreter, named gw0, gw1 and so on, as xdist names them. 2, collect: under full collection, the default, every worker collects the whole suite, each worker's count and hash are checked before it gets a test, and gw0 ships the nodeid list; under lazy collection, picked for large suites on a warm cache, each file is collected once, on one worker, on demand. 3, dispatch: slow tests and costly module units first, then contiguous chunks. 4, run and stream: pytest's own runtest_protocol, each phase streamed back live; a crashed worker's tests move and the worker is replaced. 5, wind down: held items run with no successor, workers stay connected for reruns, session fixtures tear down at end of session, then the serial phase runs @serial tests on one worker. Finally exit codes and reports merge." viewBox="0 0 820 1050">
<style>
svg { --ink: #1f2427; --muted: #6b7178; --line: #a0a5ab; --box: #f4f5f6; --chip: #ffffff; --accent: #00897b; --accent-bg: #e0f2f1; --bg: #ffffff; }
@media (prefers-color-scheme: dark) {
  svg { --ink: #e2e4e9; --muted: #9aa0a6; --line: #5c6370; --box: #2a2d36; --chip: #1e2129; --accent: #4db6ac; --accent-bg: #15302d; --bg: #1a1c22; }
}
text { fill: var(--ink); text-anchor: middle; font-family: Inter, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
.rs-title { font-size: 19px; font-weight: 700; }
.rs-sub { font-size: 14.5px; }
.rs-sm.rs-title { font-size: 17px; }
.rs-sm.rs-sub { font-size: 13.5px; }
.rs-label { fill: var(--muted); font-size: 12.5px; font-weight: 600; }
.rs-start { text-anchor: start; }
.rs-end { text-anchor: end; }
.rs-tag { fill: var(--accent); font-size: 12.5px; font-weight: 600; letter-spacing: 0.5px; }
.rs-bg { fill: var(--bg); }
.rs-box { fill: var(--box); stroke: var(--line); stroke-width: 1.5; }
.rs-hot { fill: var(--accent-bg); stroke: var(--accent); stroke-width: 2.5; }
.rs-loop { fill: var(--box); stroke: var(--accent); stroke-width: 2; stroke-dasharray: 7 5; }
.rs-chips rect { fill: var(--chip); stroke: var(--accent); }
.rs-chips text { font-size: 12px; font-weight: 600; }
.rs-row { fill: var(--chip); stroke: var(--line); stroke-width: 1; }
.rs-row-text { font-size: 13.5px; }
.rs-note { fill: var(--muted); font-size: 12.5px; }
.rs-bar { fill: var(--line); }
.rs-bar-hot { fill: var(--accent); }
.rs-dash { stroke: var(--muted); stroke-width: 1.5; stroke-dasharray: 4 4; fill: none; }
.rs-line, .rs-edge { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.rs-thin { stroke: var(--muted); stroke-width: 1.5; fill: none; }
.rs-edge { marker-end: url(#rs-arrow); }
.rs-edge.rs-accent { stroke: var(--accent); marker-end: url(#rs-arrow-accent); }
.rs-head { fill: var(--ink); }
.rs-head-accent { fill: var(--accent); }
</style>
<defs>
<marker id="rs-arrow" markerWidth="10" markerHeight="10" refX="7" refY="3.5" orient="auto"><path class="rs-head" d="M0 0L7 3.5L0 7"/></marker>
<marker id="rs-arrow-accent" markerWidth="10" markerHeight="10" refX="7" refY="3.5" orient="auto"><path class="rs-head-accent" d="M0 0L7 3.5L0 7"/></marker>
</defs>
<rect class="rs-bg" width="100%" height="100%" rx="16"/>
<rect class="rs-box" x="60" y="20" width="460" height="80" rx="14"/>
<text class="rs-title" x="290" y="54">1. Spawn</text>
<text class="rs-sub" x="290" y="80">N workers in your interpreter: gw0, gw1, ...</text>
<line class="rs-thin" x1="520" y1="60" x2="582" y2="60"/>
<rect class="rs-box" x="582" y="20" width="200" height="80" rx="14"/>
<text class="rs-title rs-sm" x="682" y="54">xdist's names</text>
<text class="rs-sub rs-sm" x="682" y="78">plugins key on gwN</text>
<path class="rs-line" d="M290 100 V116 M215 116 H605"/>
<line class="rs-edge" x1="215" y1="116" x2="215" y2="132"/>
<line class="rs-edge" x1="605" y1="116" x2="605" y2="132"/>
<rect class="rs-box rs-hot" x="40" y="140" width="350" height="222" rx="14"/>
<text class="rs-title rs-sm" x="215" y="168">2. Collect: full (default)</text>
<rect class="rs-row" x="56" y="184" width="318" height="44" rx="8"/><text class="rs-row-text" x="215" y="211">Every worker collects the whole suite</text>
<rect class="rs-row" x="56" y="236" width="318" height="44" rx="8"/><text class="rs-row-text" x="215" y="263">Count and hash checked per worker</text>
<rect class="rs-row" x="56" y="288" width="318" height="44" rx="8"/><text class="rs-row-text" x="215" y="315">gw0 ships the nodeid list</text>
<text class="rs-note" x="215" y="350">a mismatch aborts before that worker gets a test</text>
<rect class="rs-box" x="430" y="140" width="350" height="222" rx="14"/>
<text class="rs-title rs-sm" x="605" y="168">2. Collect: lazy</text>
<rect class="rs-row" x="446" y="184" width="318" height="44" rx="8"/><text class="rs-row-text" x="605" y="211">Orchestrator walks the test files</text>
<rect class="rs-row" x="446" y="236" width="318" height="44" rx="8"/><text class="rs-row-text" x="605" y="263">Each file collected once, on one worker</text>
<rect class="rs-row" x="446" y="288" width="318" height="44" rx="8"/><text class="rs-row-text" x="605" y="315">Nodeids streamed back on demand</text>
<text class="rs-note" x="605" y="350">auto-picked for a large suite on a warm cache</text>
<path class="rs-line" d="M215 362 V378 M605 362 V378 M215 378 H605"/>
<line class="rs-edge" x1="290" y1="378" x2="290" y2="394"/>
<rect class="rs-box rs-hot" x="60" y="402" width="460" height="128" rx="14"/>
<text class="rs-title" x="290" y="436">3. Dispatch</text>
<text class="rs-sub" x="290" y="460">item indices, fed as each worker drains</text>
<g class="rs-chips">
<rect x="112" y="478" width="128" height="32" rx="8"/><text x="176" y="499">slow tests first</text>
<rect x="250" y="478" width="149" height="32" rx="8"/><text x="324" y="499">costly module units</text>
<rect x="409" y="478" width="58" height="32" rx="8"/><text x="438" y="499">chunks</text>
</g>
<line class="rs-thin" x1="520" y1="466" x2="582" y2="466"/>
<rect class="rs-box" x="582" y="426" width="200" height="80" rx="14"/>
<text class="rs-title rs-sm" x="682" y="460">See Scheduling</text>
<text class="rs-sub rs-sm" x="682" y="484">order and grouping</text>
<line class="rs-edge" x1="290" y1="530" x2="290" y2="550"/>
<rect class="rs-box" x="60" y="558" width="460" height="80" rx="14"/>
<text class="rs-title" x="290" y="592">4. Run and stream</text>
<text class="rs-sub" x="290" y="618">pytest's own runtest_protocol, each phase live</text>
<line class="rs-edge rs-accent" x1="520" y1="598" x2="574" y2="598"/>
<rect class="rs-box" x="582" y="558" width="200" height="80" rx="14"/>
<text class="rs-title rs-sm" x="682" y="592">Worker crash</text>
<text class="rs-sub rs-sm" x="682" y="616">tests move, gwN respawns</text>
<line class="rs-edge" x1="290" y1="638" x2="290" y2="658"/>
<rect class="rs-box" x="60" y="666" width="460" height="250" rx="14"/>
<text class="rs-title" x="290" y="700">5. Wind down</text>
<rect class="rs-row" x="76" y="716" width="428" height="40" rx="8"/><text class="rs-row-text" x="290" y="741">Queue empty: held items run with nextitem=None</text>
<rect class="rs-row" x="76" y="764" width="428" height="40" rx="8"/><text class="rs-row-text" x="290" y="789">Workers stay connected: a rerun may still arrive</text>
<rect class="rs-row" x="76" y="812" width="428" height="40" rx="8"/><text class="rs-row-text" x="290" y="837">End of session: session fixtures tear down</text>
<rect class="rs-row" x="76" y="860" width="428" height="40" rx="8"/><text class="rs-row-text" x="290" y="885">Serial phase: @serial tests, alone, on one worker</text>
<line class="rs-edge" x1="290" y1="916" x2="290" y2="936"/>
<rect class="rs-loop" x="60" y="944" width="460" height="86" rx="14"/>
<text class="rs-title" x="290" y="978">Merge</text>
<text class="rs-sub" x="290" y="1004">exit codes, summary, junitxml, lastfailed</text>
</svg>
