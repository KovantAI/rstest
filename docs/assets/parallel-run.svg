<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A parallel run in five steps. 1, spawn: N workers start in your interpreter, named gw0, gw1 and so on, as xdist names them. 2, collect: under full collection, the default, every worker collects the whole suite, each worker's count and hash are checked before it gets a test, and gw0 ships the nodeid list; under lazy collection, picked for large suites on a warm cache, each file is collected once, on one worker, on demand. 3, dispatch: slow tests and costly module units first, then contiguous chunks. 4, run and stream: pytest's own runtest_protocol, each phase streamed back live; a crashed worker's tests move and the worker is replaced. 5, wind down: held items run with no successor, workers stay connected for reruns, session fixtures tear down at end of session, then the serial phase runs @serial tests on one worker. Finally exit codes and reports merge." viewBox="0 0 820 1164">
<style>
svg { --ink: #1f2427; --muted: #6b7178; --line: #a0a5ab; --box: #f4f5f6; --chip: #ffffff; --accent: #00897b; --accent-bg: #e0f2f1; --bg: #ffffff; }
@media (prefers-color-scheme: dark) {
  svg { --ink: #e2e4e9; --muted: #9aa0a6; --line: #5c6370; --box: #2a2d36; --chip: #1e2129; --accent: #4db6ac; --accent-bg: #15302d; --bg: #1a1c22; }
}
text { fill: var(--ink); text-anchor: middle; font-family: Inter, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
.rs-title { font-size: 19px; font-weight: 700; }
.rs-sub { font-size: 14.5px; }
.rs-sm.rs-title { font-size: 17px; }
.rs-sm.rs-sub { font-size: 13.5px; }
.rs-label { fill: var(--muted); font-size: 12.5px; font-weight: 600; }
.rs-start { text-anchor: start; }
.rs-end { text-anchor: end; }
.rs-tag { fill: var(--accent); font-size: 12.5px; font-weight: 600; letter-spacing: 0.5px; }
.rs-bg { fill: var(--bg); }
.rs-box { fill: var(--box); stroke: var(--line); stroke-width: 1.5; }
.rs-hot { fill: var(--accent-bg); stroke: var(--accent); stroke-width: 2.5; }
.rs-loop { fill: var(--box); stroke: var(--accent); stroke-width: 2; stroke-dasharray: 7 5; }
.rs-chips rect { fill: var(--chip); stroke: var(--accent); }
.rs-chips text { font-size: 12px; font-weight: 600; }
.rs-row { fill: var(--chip); stroke: var(--line); stroke-width: 1; }
.rs-row-text { font-size: 13.5px; }
.rs-note { fill: var(--muted); font-size: 12.5px; }
.rs-bar { fill: var(--line); }
.rs-bar-hot { fill: var(--accent); }
.rs-dash { stroke: var(--muted); stroke-width: 1.5; stroke-dasharray: 4 4; fill: none; }
.rs-line, .rs-edge { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.rs-thin { stroke: var(--muted); stroke-width: 1.5; fill: none; }
.rs-edge { marker-end: url(#rs-arrow); }
.rs-edge.rs-accent { stroke: var(--accent); marker-end: url(#rs-arrow-accent); }
.rs-head { fill: var(--ink); }
.rs-head-accent { fill: var(--accent); }
</style>
<defs>
<marker id="rs-arrow" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path class="rs-head" d="M0 0L10 5L0 10"/></marker>
<marker id="rs-arrow-accent" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path class="rs-head-accent" d="M0 0L10 5L0 10"/></marker>
</defs>
<rect class="rs-bg" width="100%" height="100%" rx="16"/>
<rect class="rs-box" x="60" y="20" width="460" height="80" rx="14"/>
<text class="rs-title" x="290" y="54">1. Spawn</text>
<text class="rs-sub" x="290" y="80">N workers in your interpreter: gw0, gw1, ...</text>
<line class="rs-thin" x1="520" y1="60" x2="582" y2="60"/>
<rect class="rs-box" x="582" y="20" width="200" height="80" rx="14"/>
<text class="rs-title rs-sm" x="682" y="54">xdist's names</text>
<text class="rs-sub rs-sm" x="682" y="78">plugins key on gwN</text>
<path class="rs-line" d="M290 100 V128 M215 128 H605"/>
<line class="rs-edge" x1="215" y1="128" x2="215" y2="162"/>
<line class="rs-edge" x1="605" y1="128" x2="605" y2="162"/>
<rect class="rs-box rs-hot" x="40" y="170" width="350" height="222" rx="14"/>
<text class="rs-title rs-sm" x="215" y="198">2. Collect: full (default)</text>
<rect class="rs-row" x="56" y="214" width="318" height="44" rx="8"/><text class="rs-row-text" x="215" y="241">Every worker collects the whole suite</text>
<rect class="rs-row" x="56" y="266" width="318" height="44" rx="8"/><text class="rs-row-text" x="215" y="293">Count and hash checked per worker</text>
<rect class="rs-row" x="56" y="318" width="318" height="44" rx="8"/><text class="rs-row-text" x="215" y="345">gw0 ships the nodeid list</text>
<text class="rs-note" x="215" y="380">a mismatch aborts before that worker gets a test</text>
<rect class="rs-box" x="430" y="170" width="350" height="222" rx="14"/>
<text class="rs-title rs-sm" x="605" y="198">2. Collect: lazy</text>
<rect class="rs-row" x="446" y="214" width="318" height="44" rx="8"/><text class="rs-row-text" x="605" y="241">Orchestrator walks the test files</text>
<rect class="rs-row" x="446" y="266" width="318" height="44" rx="8"/><text class="rs-row-text" x="605" y="293">Each file collected once, on one worker</text>
<rect class="rs-row" x="446" y="318" width="318" height="44" rx="8"/><text class="rs-row-text" x="605" y="345">Nodeids streamed back on demand</text>
<text class="rs-note" x="605" y="380">auto-picked for a large suite on a warm cache</text>
<path class="rs-line" d="M215 392 V420 M605 392 V420 M215 420 H605"/>
<line class="rs-edge" x1="290" y1="420" x2="290" y2="454"/>
<rect class="rs-box rs-hot" x="60" y="462" width="460" height="128" rx="14"/>
<text class="rs-title" x="290" y="496">3. Dispatch</text>
<text class="rs-sub" x="290" y="520">item indices, fed as each worker drains</text>
<g class="rs-chips">
<rect x="112" y="538" width="128" height="32" rx="8"/><text x="176" y="559">slow tests first</text>
<rect x="250" y="538" width="149" height="32" rx="8"/><text x="324" y="559">costly module units</text>
<rect x="409" y="538" width="58" height="32" rx="8"/><text x="438" y="559">chunks</text>
</g>
<line class="rs-thin" x1="520" y1="526" x2="582" y2="526"/>
<rect class="rs-box" x="582" y="486" width="200" height="80" rx="14"/>
<text class="rs-title rs-sm" x="682" y="520">See Scheduling</text>
<text class="rs-sub rs-sm" x="682" y="544">order and grouping</text>
<line class="rs-edge" x1="290" y1="590" x2="290" y2="628"/>
<rect class="rs-box" x="60" y="636" width="460" height="80" rx="14"/>
<text class="rs-title" x="290" y="670">4. Run and stream</text>
<text class="rs-sub" x="290" y="696">pytest's own runtest_protocol, each phase live</text>
<line class="rs-edge rs-accent" x1="520" y1="676" x2="574" y2="676"/>
<rect class="rs-box" x="582" y="636" width="200" height="80" rx="14"/>
<text class="rs-title rs-sm" x="682" y="670">Worker crash</text>
<text class="rs-sub rs-sm" x="682" y="694">tests move, gwN respawns</text>
<line class="rs-edge" x1="290" y1="716" x2="290" y2="754"/>
<rect class="rs-box" x="60" y="762" width="460" height="250" rx="14"/>
<text class="rs-title" x="290" y="796">5. Wind down</text>
<rect class="rs-row" x="76" y="812" width="428" height="40" rx="8"/><text class="rs-row-text" x="290" y="837">Queue empty: held items run with nextitem=None</text>
<rect class="rs-row" x="76" y="860" width="428" height="40" rx="8"/><text class="rs-row-text" x="290" y="885">Workers stay connected: a rerun may still arrive</text>
<rect class="rs-row" x="76" y="908" width="428" height="40" rx="8"/><text class="rs-row-text" x="290" y="933">End of session: session fixtures tear down</text>
<rect class="rs-row" x="76" y="956" width="428" height="40" rx="8"/><text class="rs-row-text" x="290" y="981">Serial phase: @serial tests, alone, on one worker</text>
<line class="rs-edge" x1="290" y1="1012" x2="290" y2="1050"/>
<rect class="rs-loop" x="60" y="1058" width="460" height="86" rx="14"/>
<text class="rs-title" x="290" y="1092">Merge</text>
<text class="rs-sub" x="290" y="1118">exit codes, summary, junitxml, lastfailed</text>
</svg>
