<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The nextitem invariant, as a sequence between the orchestrator and one worker. The orchestrator sends items a, b, c. The worker runs a with nextitem b and b with nextitem c, then holds c because its successor is unknown. The orchestrator sends d and e; the worker runs c with nextitem d and d with nextitem e, then holds e. The orchestrator sends no_more_items; the worker runs e with nextitem None, which tears down its module fixtures, and stays connected because a rerun may still arrive. The orchestrator sends end of session; session fixtures tear down and the worker exits. Under -x or --maxfail the orchestrator sends stop_run instead: the worker finishes the test it is running and reports its queued items, the held one included, as never run." viewBox="0 0 820 640">
<style>
svg { --ink: #1f2427; --muted: #6b7178; --line: #a0a5ab; --box: #f4f5f6; --chip: #ffffff; --accent: #00897b; --accent-bg: #e0f2f1; --bg: #ffffff; }
@media (prefers-color-scheme: dark) {
  svg { --ink: #e2e4e9; --muted: #9aa0a6; --line: #5c6370; --box: #2a2d36; --chip: #1e2129; --accent: #4db6ac; --accent-bg: #15302d; --bg: #1a1c22; }
}
text { fill: var(--ink); text-anchor: middle; font-family: Inter, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
.rs-title { font-size: 19px; font-weight: 700; }
.rs-sub { font-size: 14.5px; }
.rs-sm.rs-title { font-size: 17px; }
.rs-sm.rs-sub { font-size: 13.5px; }
.rs-label { fill: var(--muted); font-size: 12.5px; font-weight: 600; }
.rs-start { text-anchor: start; }
.rs-end { text-anchor: end; }
.rs-tag { fill: var(--accent); font-size: 12.5px; font-weight: 600; letter-spacing: 0.5px; }
.rs-bg { fill: var(--bg); }
.rs-box { fill: var(--box); stroke: var(--line); stroke-width: 1.5; }
.rs-hot { fill: var(--accent-bg); stroke: var(--accent); stroke-width: 2.5; }
.rs-loop { fill: var(--box); stroke: var(--accent); stroke-width: 2; stroke-dasharray: 7 5; }
.rs-chips rect { fill: var(--chip); stroke: var(--accent); }
.rs-chips text { font-size: 12px; font-weight: 600; }
.rs-row { fill: var(--chip); stroke: var(--line); stroke-width: 1; }
.rs-row-text { font-size: 13.5px; }
.rs-note { fill: var(--muted); font-size: 12.5px; }
.rs-bar { fill: var(--line); }
.rs-bar-hot { fill: var(--accent); }
.rs-dash { stroke: var(--muted); stroke-width: 1.5; stroke-dasharray: 4 4; fill: none; }
.rs-line, .rs-edge { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.rs-thin { stroke: var(--muted); stroke-width: 1.5; fill: none; }
.rs-edge { marker-end: url(#rs-arrow); }
.rs-edge.rs-accent { stroke: var(--accent); marker-end: url(#rs-arrow-accent); }
.rs-head { fill: var(--ink); }
.rs-head-accent { fill: var(--accent); }
</style>
<defs>
<marker id="rs-arrow" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path class="rs-head" d="M0 0L10 5L0 10"/></marker>
<marker id="rs-arrow-accent" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path class="rs-head-accent" d="M0 0L10 5L0 10"/></marker>
</defs>
<rect class="rs-bg" width="100%" height="100%" rx="16"/>
<rect class="rs-box" x="40" y="20" width="200" height="52" rx="12"/>
<text class="rs-title rs-sm" x="140" y="52">Orchestrator</text>
<rect class="rs-box" x="380" y="20" width="200" height="52" rx="12"/>
<text class="rs-title rs-sm" x="480" y="52">Worker gw1</text>
<line class="rs-dash" x1="140" y1="72" x2="140" y2="520"/>
<line class="rs-dash" x1="480" y1="72" x2="480" y2="520"/>
<text class="rs-label" x="310" y="106">items [a, b, c]</text>
<line class="rs-edge" x1="140" y1="116" x2="470" y2="116"/>
<rect class="rs-row" x="500" y="128" width="290" height="28" rx="6"/><text class="rs-row-text rs-start" x="512" y="147">run a (nextitem = b)</text>
<rect class="rs-row" x="500" y="162" width="290" height="28" rx="6"/><text class="rs-row-text rs-start" x="512" y="181">run b (nextitem = c)</text>
<rect class="rs-hot" x="500" y="196" width="290" height="28" rx="6"/><text class="rs-row-text rs-start" x="512" y="215">hold c: its successor is unknown</text>
<text class="rs-label" x="310" y="250">items [d, e]</text>
<line class="rs-edge" x1="140" y1="260" x2="470" y2="260"/>
<rect class="rs-row" x="500" y="272" width="290" height="28" rx="6"/><text class="rs-row-text rs-start" x="512" y="291">run c (nextitem = d), d (nextitem = e)</text>
<rect class="rs-hot" x="500" y="306" width="290" height="28" rx="6"/><text class="rs-row-text rs-start" x="512" y="325">hold e</text>
<text class="rs-label" x="310" y="356">no_more_items (queue empty for now)</text>
<line class="rs-edge" x1="140" y1="366" x2="470" y2="366"/>
<rect class="rs-row" x="500" y="378" width="290" height="28" rx="6"/><text class="rs-row-text rs-start" x="512" y="397">run e (nextitem = None)</text>
<rect class="rs-row" x="500" y="412" width="290" height="28" rx="6"/><text class="rs-row-text rs-start" x="512" y="431">stay connected: a rerun may arrive</text>
<text class="rs-label" x="310" y="466">end of session</text>
<line class="rs-edge" x1="140" y1="476" x2="470" y2="476"/>
<rect class="rs-row" x="500" y="488" width="290" height="28" rx="6"/><text class="rs-row-text rs-start" x="512" y="507">session fixtures tear down, exit</text>
<rect class="rs-loop" x="40" y="540" width="750" height="84" rx="14"/>
<text class="rs-title rs-sm" x="415" y="570">With -x or --maxfail: stop_run</text>
<text class="rs-sub rs-sm" x="415" y="594">the worker finishes the running test; queued items, the held one included, never run</text>
<text class="rs-tag" x="415" y="614">EVERY PATH KEEPS A SUCCESSOR IN FLIGHT OR RELEASES THE QUEUE</text>
</svg>
