[package]
name = "rstest-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
default = ["http-cache"]
# HTTP(S) shared-cache transport (`--cache-remote https://…`). Off by default
# only via `--no-default-features` for a zero-network build.
http-cache = ["dep:ureq"]

[lib]
name = "rstest_cli"
path = "src/lib.rs"

[[bin]]
name = "rstest"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ignore = "0.4"
rmp-serde = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
toml = "1.1"
notify = "8"
sha2 = "0.11"
ureq = { version = "2", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Pipes"] }
