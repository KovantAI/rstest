site_name: rstest
site_description: A fast, pytest-compatible test runner, parallel by design, with built-in suite diagnostics
site_url: https://python-rstest.readthedocs.io/
repo_url: https://github.com/KovantAI/rstest
repo_name: KovantAI/rstest
edit_uri: edit/main/docs/
docs_dir: docs

theme:
  name: material
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.tracking
    - navigation.indexes
    - navigation.path
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - content.tabs.link
    - search.suggest
    - search.highlight
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

exclude_docs: |
  # Generated schema partials: embedded via pymdownx snippets into
  # reference/output-schemas.md, not standalone pages. The .schema.json files
  # are kept (copied as static assets) so they are directly downloadable.
  reference/schemas/*.md
  # Shared partials embedded via pymdownx snippets (--8<--), one canonical
  # copy for content that appears on several pages.
  _snippets/

plugins:
  - search
  # Renamed pages keep their old URLs working.
  - redirects:
      redirect_maps:
        getting-started/first-steps.md: getting-started/run-your-suite.md
        getting-started/your-first-test.md: getting-started/start-from-scratch.md

# Every link problem is a warning, so `mkdocs build --strict` (CI's docs job)
# fails on it. mkdocs only reports broken #anchors at info level by default,
# which let a link to a renamed heading ship silently.
validation:
  nav:
    omitted_files: warn
    not_found: warn
    absolute_links: warn
  links:
    not_found: warn
    anchors: warn
    absolute_links: warn
    unrecognized_links: warn

nav:
  - Introduction: index.md
  - Getting started:
      - getting-started/index.md
      - Evaluating rstest: getting-started/evaluating.md
      - Installation: getting-started/installation.md
      - Start from scratch: getting-started/start-from-scratch.md
      - Run your existing suite: getting-started/run-your-suite.md
      - Features: getting-started/features.md
      - Getting help: getting-started/getting-help.md
  - Guides:
      - guides/index.md
      - Migrating:
          - Migrating from pytest: guides/migrate-from-pytest.md
          - Upgrading to pytest 9: guides/upgrade-to-pytest9.md
          - Migrating from pytest-xdist: guides/migrate-from-xdist.md
      - Running tests well:
          - Parallel safety: guides/parallel-safety.md
          - Suite diagnostics: guides/doctor.md
          - Wait-bound / IO suites: guides/wait-bound.md
          - Local dev / inner loop: guides/local-dev.md
          - Watch mode: guides/watch-mode.md
          - Debugging a test: guides/debugging.md
          - Selecting changed tests: guides/changed.md
          - Running only what changed since green: guides/since-green.md
          - Flaky tests: guides/flaky-tests.md
          - Catching slowdowns: guides/slowdowns.md
          - Resource leaks: guides/resource-leaks.md
          - Replaying a CI failure locally: guides/replay.md
          - Monorepos: guides/monorepo.md
          - Running on Windows: guides/windows.md
      - CI:
          - CI quickstart: guides/ci-quickstart.md
          - CI output formats: guides/ci-output.md
          - More CI systems: guides/ci-recipes.md
          - Shared cache across CI jobs: guides/ci-shared-cache.md
          - Sharding across CI jobs: guides/sharding.md
      - Plugins and coverage:
          - Your plugin stack: guides/plugin-stack.md
          - Plugins: guides/plugins.md
          - Coverage: guides/coverage.md
      - Coding agents:
          - Agent skills: guides/agent-skills.md
  - Concepts:
      - concepts/index.md
      - Architecture: concepts/architecture.md
      - Compatibility: concepts/compatibility.md
      - Scheduling: concepts/scheduling.md
      - Lazy collection: concepts/lazy-collection.md
      - Crash handling: concepts/crash-handling.md
      - Monorepo mode: concepts/monorepo.md
      - xdist hook emulation: concepts/xdist-hooks.md
      - Caching: concepts/caching.md
      - Glossary: concepts/glossary.md
  - Reference:
