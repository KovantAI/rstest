site_name: rstest
site_description: A fast, pytest-compatible test runner, parallel by design, with built-in suite diagnostics
site_url: https://python-rstest.readthedocs.io/
repo_url: https://github.com/KovantAI/rstest
repo_name: KovantAI/rstest
edit_uri: edit/main/docs/
docs_dir: docs

theme:
  name: material
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.tracking
    - navigation.indexes
    - navigation.path
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - content.tabs.link
    - search.suggest
    - search.highlight
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

exclude_docs: |
  # Generated schema partials: embedded via pymdownx snippets into
  # reference/output-schemas.md, not standalone pages. The .schema.json files
  # are kept (copied as static assets) so they are directly downloadable.
  reference/schemas/*.md
  # Shared partials embedded via pymdownx snippets (--8<--), one canonical
  # copy for content that appears on several pages.
  _snippets/

plugins:
  - search

nav:
  - Introduction: index.md
  - Getting started:
      - getting-started/index.md
      - Installation: getting-started/installation.md
      - Start from scratch: getting-started/your-first-test.md
      - Run your existing suite: getting-started/first-steps.md
      - Features: getting-started/features.md
      - Getting help: getting-started/getting-help.md
  - Playbooks:
      - Wait-bound / IO suites: guides/wait-bound.md
      - Local dev / inner loop: guides/local-dev.md
      - Your plugin stack: guides/plugin-stack.md
  - Guides:
      - guides/index.md
      - Migrating from pytest: guides/migrate-from-pytest.md
      - Upgrading to pytest 9: guides/upgrade-to-pytest9.md
      - Migrating from pytest-xdist: guides/migrate-from-xdist.md
      - Parallel safety: guides/parallel-safety.md
      - Suite diagnostics: guides/doctor.md
      - Resource leaks: guides/resource-leaks.md
      - Flaky tests: guides/flaky-tests.md
      - Watch mode: guides/watch-mode.md
      - Selecting changed tests: guides/changed.md
      - Monorepos: guides/monorepo.md
      - CI quickstart: guides/ci-quickstart.md
      - More CI systems: guides/ci-recipes.md
      - Shared cache across CI jobs: guides/ci-shared-cache.md
      - Sharding across CI jobs: guides/sharding.md
      - Plugins: guides/plugins.md
      - Coverage: guides/coverage.md
  - Concepts:
      - concepts/index.md
      - Architecture: concepts/architecture.md
      - Compatibility: concepts/compatibility.md
      - Scheduling: concepts/scheduling.md
      - Lazy collection: concepts/lazy-collection.md
      - Crash handling: concepts/crash-handling.md
      - Monorepo mode: concepts/monorepo.md
      - xdist hook emulation: concepts/xdist-hooks.md
      - Caching: concepts/caching.md
      - Glossary: concepts/glossary.md
  - Reference:
      - reference/index.md
      - CLI flags: reference/cli.md
      - CLI subcommands: reference/cli-commands.md
      - Markers: reference/markers.md
      - Environment variables: reference/environment.md
      - Exit codes: reference/exit-codes.md
      - Report JSON: reference/report-json.md
      - Output schemas: reference/output-schemas.md
      - Benchmarks: reference/benchmarks.md
      - Parity divergences & upstream fixes: reference/parity-divergences.md
      - Top 100 plugins: reference/top-100-plugins.md
      - Plugins exercised by the corpus: reference/corpus-plugins.md
      - xdist support matrix: reference/xdist-support.md
      - Troubleshooting: reference/troubleshooting.md
      - Security & supply chain: reference/security.md
      - License: reference/license.md
