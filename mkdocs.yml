      - CLI flags: reference/cli.md
      - CLI subcommands: reference/cli-commands.md
      - Markers: reference/markers.md
      - Environment variables: reference/environment.md
      - Exit codes: reference/exit-codes.md
      - Report JSON: reference/report-json.md
      - Output schemas: reference/output-schemas.md
      - Benchmarks: reference/benchmarks.md
      - Parity divergences & upstream fixes: reference/parity-divergences.md
      - Top 100 plugins: reference/top-100-plugins.md
      - Plugins exercised by the corpus: reference/corpus-plugins.md
      - xdist support matrix: reference/xdist-support.md
