[workspace]
resolver = "2"
members = ["crates/rstest-cli"]
# corpus clones may build rust sdists (pydantic-core); keep them out
exclude = ["corpus/work"]

[workspace.package]
version = "0.4.0"
edition = "2021"
license = "MIT OR Apache-2.0"
# MSRV: the crate uses `Option::is_none_or` (stable since Rust 1.82).
rust-version = "1.82"

# Codify the lint policy CI enforces (`cargo clippy -- -D warnings`) so a local
# `cargo clippy` denies the same set without the extra flag. Crates opt in via
# `[lints] workspace = true`.
[workspace.lints.rust]
unused = "deny"

[workspace.lints.clippy]
all = "deny"
