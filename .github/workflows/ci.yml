name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  gate:
    name: gate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: rustfmt
        run: cargo fmt --check

      - name: clippy
        run: cargo clippy --release -- -D warnings

      - name: build
        run: cargo build --release

      - name: cargo test
        run: cargo test --release

      - name: test gate
        run: python tests/gate.py

  wheel:
    name: wheel builds (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: build
          args: --release
      - name: smoke test wheel (unix)
        if: runner.os != 'Windows'
        run: |
          python3 -m venv /tmp/wheel-venv
          /tmp/wheel-venv/bin/pip install -q target/wheels/rstest-*.whl
          mkdir -p /tmp/wheel-smoke && cd /tmp/wheel-smoke
          cat > test_smoke.py <<'EOF'
          def test_ok():
              assert True
          EOF
          VIRTUAL_ENV=/tmp/wheel-venv /tmp/wheel-venv/bin/rstest test_smoke.py -n 2
      - name: smoke test wheel (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m venv C:\wheel-venv
          C:\wheel-venv\Scripts\pip install -q (Get-Item target\wheels\rstest-*.whl).FullName
          New-Item -ItemType Directory -Force C:\wheel-smoke | Out-Null
          Set-Location C:\wheel-smoke
          Set-Content test_smoke.py "def test_ok():`n    assert True`n`ndef test_two():`n    assert 1 + 1 == 2"
          $env:VIRTUAL_ENV = "C:\wheel-venv"
          C:\wheel-venv\Scripts\rstest.exe test_smoke.py -n 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheel-${{ matrix.os }}
          path: target/wheels/*.whl

  docs:
    name: docs build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: install docs toolchain
        run: pip install -r docs/requirements.txt
      - name: build (strict)
        run: mkdocs build --strict
