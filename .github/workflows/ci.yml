name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-lint:
    name: rust lint (debug)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # Debug clippy for fast feedback (release build lives in the gate job).
      # Same invocation as the pre-commit hook, so local == CI.
      - name: rustfmt
        run: cargo fmt --check

      - name: clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  cargo-deny:
    name: dependency audit (advisories + licenses)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Scans the locked dependency tree against the RustSec advisory DB and the
      # license allow-list in deny.toml; also flags non-crates.io sources.
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories licenses bans sources

  gate:
    name: gate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: build
        run: cargo build --release

      - name: cargo test
        run: cargo test --release

      - name: test gate
        run: python e2e/gate.py

  python-lint:
    name: python lint + worker tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: uv lock --check
        run: uv lock --check

      - name: ruff check
        run: uvx ruff@0.16.5 check python/rstest_worker python/tests

      - name: ruff format --check
        run: uvx ruff@0.16.5 format --check python/rstest_worker python/tests

      - name: ty (type check worker)
        run: uvx --with msgpack --with pytest --with coverage ty@0.0.75 check python/rstest_worker

      - name: worker unit tests (with coverage)
        run: uvx --with msgpack --with coverage --with pytest-cov pytest python/tests --cov --cov-report=xml

      - name: upload python coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: coverage.xml
          flags: python
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  wheel:
    name: wheel builds (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: build
          args: --release
      - name: smoke test wheel (unix)
        if: runner.os != 'Windows'
        run: |
          python3 -m venv /tmp/wheel-venv
          /tmp/wheel-venv/bin/pip install -q target/wheels/rstest-*.whl
          mkdir -p /tmp/wheel-smoke && cd /tmp/wheel-smoke
          cat > test_smoke.py <<'EOF'
          def test_ok():
              assert True
          EOF
          VIRTUAL_ENV=/tmp/wheel-venv /tmp/wheel-venv/bin/rstest test_smoke.py -n 2
      - name: smoke test wheel (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m venv C:\wheel-venv
          C:\wheel-venv\Scripts\pip install -q (Get-Item target\wheels\rstest-*.whl).FullName
          New-Item -ItemType Directory -Force C:\wheel-smoke | Out-Null
          Set-Location C:\wheel-smoke
          Set-Content test_smoke.py "def test_ok():`n    assert True`n`ndef test_two():`n    assert 1 + 1 == 2"
          $env:VIRTUAL_ENV = "C:\wheel-venv"
          C:\wheel-venv\Scripts\rstest.exe test_smoke.py -n 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheel-${{ matrix.os }}
          path: target/wheels/*.whl

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - uses: taiki-e/install-action@37f7c5781271959fb65b6b35224e28652ff2b63d # v2.87.0
        with:
          tool: cargo-llvm-cov

      # Two separate instrumented runs so unit and e2e coverage upload under
      # distinct flags. `show-env` exports the RUSTFLAGS / LLVM_PROFILE_FILE the
      # build and binary inherit, so gate.py's subprocess runs land in the
      # profile set too. `clean` between runs keeps the two profile sets apart.
      - name: collect rust unit coverage
        run: |
          source <(cargo llvm-cov show-env --export-prefix)
          cargo llvm-cov clean --workspace
          cargo test --release
          cargo llvm-cov report --release --lcov --output-path unit.lcov

      - name: collect rust e2e coverage
        run: |
          source <(cargo llvm-cov show-env --export-prefix)
          cargo llvm-cov clean --workspace
          cargo build --release
          python e2e/gate.py --binary target/release/rstest
          cargo llvm-cov report --release --lcov --output-path e2e.lcov

      - name: upload rust-unit coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: unit.lcov
          flags: rust-unit
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: upload rust-e2e coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: e2e.lcov
          flags: rust-e2e
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  docs:
    name: docs build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: install docs toolchain
        run: pip install -r docs/requirements.txt
      - name: build (strict)
        run: mkdocs build --strict
