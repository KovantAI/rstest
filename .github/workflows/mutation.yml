name: mutation

# Mutation testing (cargo-mutants) — see mutation-testing-plan.md.
#   PR    : mutate only the lines the PR changed; fail on a new survivor.
#   nightly: mutate the whole tree; report-only (never blocks).
# Both enable the e2e cache gate (crates/rstest-cli/tests/gate_e2e.rs) so IO /
# cache mutants that the unit suite can't reach are still caught.

on:
  pull_request:
  schedule:
    - cron: "0 3 * * *" # 03:00 UTC nightly
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # The gate drives the real binary against a prebuilt worker venv.
  RSTEST_RUN_GATE: "1"
  RSTEST_GATE_VENV: ${{ github.workspace }}/.gate-venv

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --- PR: incremental, blocking on changed lines ------------------------
  incremental:
    name: mutants (changed lines)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # need the base commit to diff against

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: taiki-e/install-action@43aecc8d72668fbcfe75c31400bc4f890f1c5853 # v2.83.2
        with:
          tool: cargo-mutants

      - name: build worker venv
        run: |
          python -m venv .gate-venv
          .gate-venv/bin/pip install -q \
            msgpack "pluggy>=1.5" iniconfig packaging pygments coverage pytest-cov

      - name: diff vs base
        env:
          BASE_REF: ${{ github.base_ref }}
        run: git diff "origin/${BASE_REF}...HEAD" > pr.diff

      - name: mutate changed lines
        # Non-zero exit on a surviving mutant fails the PR — new code must be
        # killed by a test. Scoped to the diff so it stays fast.
        run: cargo mutants --in-diff pr.diff -j 2

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: mutants-incremental
          path: mutants.out/

  # --- nightly: full tree, report-only -----------------------------------
  full:
    name: mutants (full tree)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: taiki-e/install-action@43aecc8d72668fbcfe75c31400bc4f890f1c5853 # v2.83.2
        with:
          tool: cargo-mutants

      - name: build worker venv
        run: |
          python -m venv .gate-venv
          .gate-venv/bin/pip install -q \
            msgpack "pluggy>=1.5" iniconfig packaging pygments coverage pytest-cov

      - name: mutate whole tree (report-only)
        # Never blocks: nightly tracks the whole-suite score as a trend.
        run: cargo mutants -j 2 || true

      - name: score summary
        if: always()
        run: |
          count() { test -f "mutants.out/$1" && wc -l < "mutants.out/$1" || echo 0; }
          caught=$(count caught.txt); missed=$(count missed.txt)
          total=$((caught + missed))
          pct="n/a"; [ "$total" -gt 0 ] && pct=$(( caught * 100 / total ))
          {
            echo "## Mutation score (full tree)"
            echo ""
            echo "**${pct}% caught** — ${caught} caught, ${missed} missed, $(count timeout.txt) timeout, $(count unviable.txt) unviable."
            if [ "$missed" -gt 0 ]; then
              echo ""
              echo "<details><summary>Surviving mutants</summary>"
              echo ""
              echo '```'
              cat mutants.out/missed.txt
              echo '```'
              echo "</details>"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: mutants-full
          path: mutants.out/
