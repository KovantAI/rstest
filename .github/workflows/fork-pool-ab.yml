name: fork-pool A/B (Linux)

# Decides whether `--fork-pool` should become the default on Linux. On macOS
# (M4 Max, 2026-10-29, corpus/bench-results/2026-10-29-fork-pool-ab.json) it
# was within noise; the open question is a standard Linux CI runner, where
# process spawn is slower. Runs corpus/fork_ab.py: same binary and suite
# venvs, plain vs --fork-pool alternating per repeat, median + min-max band,
# per-test parity on the first repeat. Nothing is gated. Pushing the
# bench/fork-pool-linux branch runs it with the defaults (workflow_dispatch
# needs the file on main first).

on:
  push:
    branches: [bench/fork-pool-linux]
  workflow_dispatch:
    inputs:
      suites:
        description: "corpus suites (comma-separated, must be in suites.toml)"
        default: "python-dateutil,click,attrs,jsonschema,fastapi,django-allauth,anyio,rich"
      workers:
        description: "-n values (comma-separated, auto or N)"
        default: "auto,4,8"
      repeat:
        description: "runs per arm per point (median reported)"
        default: "5"

permissions:
  contents: read

jobs:
  ab:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.7"

      - name: build + install rstest
        run: |
          python -m venv .bench-venv
          . .bench-venv/bin/activate
          pip install --quiet --require-hashes -r .github/requirements/bench.txt
          maturin build --release --manifest-path crates/rstest-cli/Cargo.toml --out target/wheels
          pip install --quiet target/wheels/rstest-*.whl

      # Network phase, kept out of the measured runs.
      - name: prepare corpus subset
        env:
          SUITES: ${{ inputs.suites || 'python-dateutil,click,attrs,jsonschema,fastapi,django-allauth,anyio,rich' }}
        run: |
          WHEEL=$(ls target/wheels/rstest-*.whl | head -n1)
          python corpus/run.py --prepare-only \
            --only "$SUITES" \
            --wheel "$WHEEL" \
            --rstest "$PWD/.bench-venv/bin/rstest"

      - name: measure plain vs --fork-pool
        env:
          SUITES: ${{ inputs.suites || 'python-dateutil,click,attrs,jsonschema,fastapi,django-allauth,anyio,rich' }}
          WORKERS: ${{ inputs.workers || 'auto,4,8' }}
          REPEAT: ${{ inputs.repeat || '5' }}
        run: |
          nproc
          python corpus/fork_ab.py \
            --only "$SUITES" \
            --workers "$WORKERS" \
            --repeat "$REPEAT" \
            --rstest "$PWD/.bench-venv/bin/rstest" | tee fork_ab.out
          {
            echo "## fork-pool A/B on $(nproc) vCPUs, median of $REPEAT"
            grep '^|' fork_ab.out
          } >> "$GITHUB_STEP_SUMMARY"

      - name: upload fork_ab.json
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fork-pool-ab
          path: corpus/fork_ab.json
          if-no-files-found: ignore
