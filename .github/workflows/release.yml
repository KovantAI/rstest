name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # create the release and upload assets
  id-token: write # Sigstore keyless signing (OIDC)
  attestations: write # GitHub attestation store

jobs:
  build:
    name: build + attest (${{ matrix.build.id }})
    strategy:
      fail-fast: false
      matrix:
        build:
          - { id: linux-x86_64, os: ubuntu-latest, manylinux: auto }
          - { id: linux-aarch64, os: ubuntu-24.04-arm, manylinux: auto }
          - { id: macos-arm64, os: macos-latest } # Apple silicon
          - { id: windows-x86_64, os: windows-latest }
          - { id: windows-arm64, os: windows-11-arm }
          # musllinux wheels for Alpine (musl libc, built in a musl container)
          - { id: musllinux-x86_64, os: ubuntu-latest, target: x86_64-unknown-linux-musl, manylinux: musllinux_1_2 }
          - { id: musllinux-aarch64, os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, manylinux: musllinux_1_2 }
    runs-on: ${{ matrix.build.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      # Host Rust toolchain + cache are only for native (macOS/Windows) builds.
      # Container builds (any job with `manylinux` set) get Rust from the
      # manylinux/musllinux image; sharing the host cache into an old-glibc
      # container leaks host-glibc build-script binaries and breaks the build
      # with "GLIBC_2.xx not found". So skip these for containerized jobs.
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        if: ${{ !matrix.build.manylinux }}
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        if: ${{ !matrix.build.manylinux }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: build
          args: --release
          target: ${{ matrix.build.target }}
          manylinux: ${{ matrix.build.manylinux }}

      # Signed build provenance (SLSA), stored in GitHub's attestation
      # store and bundled alongside the artifact. Verify any downloaded
      # wheel with:
      #   gh attestation verify rstest-*.whl --repo ${{ github.repository }}
      - name: attest wheel provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: target/wheels/*.whl

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-wheel-${{ matrix.build.id }}
          path: target/wheels/*.whl
          if-no-files-found: error

  # Trusted Publishing (OIDC) — no API tokens stored. Configure a publisher
  # for this repo + workflow on each index:
  #   https://pypi.org/manage/account/publishing/
  #   https://test.pypi.org/manage/account/publishing/
  publish-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment: pypi
    permissions:
      id-token: write # OIDC token for Trusted Publishing
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-wheel-*
          path: dist
          merge-multiple: true
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
        with:
          packages-dir: dist

  publish-testpypi:
    name: Publish to TestPyPI (manual)
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    environment: testpypi
    permissions:
      id-token: write # OIDC token for Trusted Publishing
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-wheel-*
          path: dist
          merge-multiple: true
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
        with:
          packages-dir: dist
          repository-url: https://test.pypi.org/legacy/

  release:
    name: draft GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-wheel-*
          path: wheels
          merge-multiple: true

      - name: checksums
        run: |
          cd wheels
          sha256sum *.whl > SHA256SUMS
          cat SHA256SUMS

      # Draft release: assets are staged for review; nothing is public
      # until the release is manually published.
      - name: create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            TAG="manual-$(date +%Y%m%d)-${GITHUB_RUN_NUMBER}"
            git tag "$TAG" && git push origin "$TAG"
          fi
          gh release create "$TAG" \
            --draft \
            --title "rstest $TAG" \
            --notes "Wheels are signed with GitHub artifact attestations. Verify: \`gh attestation verify <wheel> --repo ${GITHUB_REPOSITORY}\`. See CHANGELOG.md." \
            wheels/*.whl wheels/SHA256SUMS
