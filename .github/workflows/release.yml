name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Read-only by default; each job opts into the write scopes it needs.
permissions:
  contents: read

jobs:
  build:
    name: build + attest (${{ matrix.build.id }})
    permissions:
      contents: read
      id-token: write # Sigstore keyless signing (OIDC)
      attestations: write # GitHub attestation store
    strategy:
      fail-fast: false
      matrix:
        build:
          - { id: linux-x86_64, os: ubuntu-latest, manylinux: auto }
          - { id: linux-aarch64, os: ubuntu-24.04-arm, manylinux: auto }
          - { id: macos-arm64, os: macos-latest } # Apple silicon
          - { id: windows-x86_64, os: windows-latest }
          - { id: windows-arm64, os: windows-11-arm }
          # musllinux wheels for Alpine (musl libc, built in a musl container)
          - { id: musllinux-x86_64, os: ubuntu-latest, target: x86_64-unknown-linux-musl, manylinux: musllinux_1_2 }
          - { id: musllinux-aarch64, os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, manylinux: musllinux_1_2 }
    runs-on: ${{ matrix.build.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Host Rust toolchain + cache are only for native (macOS/Windows) builds.
      # Container builds (any job with `manylinux` set) get Rust from the
      # manylinux/musllinux image; sharing the host cache into an old-glibc
      # container leaks host-glibc build-script binaries and breaks the build
      # with "GLIBC_2.xx not found". So skip these for containerized jobs.
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        if: ${{ !matrix.build.manylinux }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: ${{ !matrix.build.manylinux }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: build
          args: --release
          target: ${{ matrix.build.target }}
          manylinux: ${{ matrix.build.manylinux }}

      # Signed build provenance (SLSA), stored in GitHub's attestation
      # store and bundled alongside the artifact. Verify any downloaded
      # wheel with:
      #   gh attestation verify rstest-*.whl --repo ${{ github.repository }}
      - name: attest wheel provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: target/wheels/*.whl

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-wheel-${{ matrix.build.id }}
          path: target/wheels/*.whl
          if-no-files-found: error

  # Trusted Publishing (OIDC) — no API tokens stored. Configure a publisher
  # for this repo + workflow on each index:
  #   https://pypi.org/manage/account/publishing/
  #   https://test.pypi.org/manage/account/publishing/
  publish-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment: pypi
    permissions:
      id-token: write # OIDC token for Trusted Publishing
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-wheel-*
          path: dist
          merge-multiple: true
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist
          attestations: true # PEP 740, signed via Trusted Publishing OIDC

  publish-testpypi:
    name: Publish to TestPyPI (manual)
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    environment: testpypi
    permissions:
      id-token: write # OIDC token for Trusted Publishing
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-wheel-*
          path: dist
          merge-multiple: true
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist
          attestations: true # PEP 740, signed via Trusted Publishing OIDC
          repository-url: https://test.pypi.org/legacy/

  release:
    name: draft GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and upload assets
      id-token: write # Sigstore keyless signing (OIDC)
      attestations: write # GitHub attestation store
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-wheel-*
          path: wheels
          merge-multiple: true

      - name: checksums
        run: |
          cd wheels
          sha256sum *.whl > SHA256SUMS
          cat SHA256SUMS

      # --- SBOM (CycloneDX) -------------------------------------------------
      # Two component sets are shipped: the Rust crates compiled into the
      # orchestrator, and the Python runtime deps a user installs alongside the
      # wheel. The vendored pytest is inside the wheel (not a declared dep), so
      # SBOM tools don't see it — its version is documented in python/VENDOR.md.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.12.7"

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: python SBOM
        run: |
          # Inventory the runtime deps actually pulled in by installing the wheel.
          # Every platform wheel declares the same deps, so install the one that
          # matches this linux x86_64 runner (an arbitrary wheel like the macOS
          # one is rejected by pip as "not a supported wheel on this platform").
          # Runtime deps come hash-pinned from uv.lock; `pip check` confirms they
          # satisfy what the wheel declares.
          python -m venv /tmp/sbom-venv
          uv export --frozen --no-dev --no-emit-project -o /tmp/sbom-requirements.txt
          /tmp/sbom-venv/bin/pip install --quiet --require-hashes -r /tmp/sbom-requirements.txt
          /tmp/sbom-venv/bin/pip install --quiet --no-deps wheels/*manylinux*x86_64*.whl
          /tmp/sbom-venv/bin/pip check
          uvx --from cyclonedx-bom@4.6.1 cyclonedx-py environment /tmp/sbom-venv \
            --outfile sbom.python.cdx.json

      - name: rust SBOM
        run: |
          cargo install cargo-cyclonedx --version 0.5.7 --locked
          # Writes <package>.cdx.json next to each crate's manifest.
          cargo cyclonedx --format json
          cp "$(find crates -name '*.cdx.json' | head -1)" sbom.rust.cdx.json

      - name: checksum SBOMs
        run: sha256sum sbom.python.cdx.json sbom.rust.cdx.json >> wheels/SHA256SUMS
      # ---------------------------------------------------------------------

      # One Sigstore-signed provenance attestation over every release asset.
      # The bundle is attached to the release so assets verify offline, e.g.
      #   gh attestation verify sbom.rust.cdx.json --repo <repo> \
      #     --bundle rstest-<tag>.sigstore.json
      - name: attest release assets
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            wheels/*.whl
            wheels/SHA256SUMS
            sbom.python.cdx.json
            sbom.rust.cdx.json

      # Draft release: assets are staged for review; nothing is public
      # until the release is manually published.
      - name: create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            TAG="manual-$(date +%Y%m%d)-${GITHUB_RUN_NUMBER}"
            git tag "$TAG" && git push origin "$TAG"
          fi
          cp "$BUNDLE" "rstest-$TAG.sigstore.json"
          gh release create "$TAG" \
            --draft \
            --title "rstest $TAG" \
            --notes "All assets are signed with GitHub artifact attestations (Sigstore). Verify: \`gh attestation verify <file> --repo ${GITHUB_REPOSITORY}\`, or offline with \`--bundle rstest-$TAG.sigstore.json\`. PyPI files carry PEP 740 attestations. CycloneDX SBOMs (\`sbom.python.cdx.json\`, \`sbom.rust.cdx.json\`) are attached. See CHANGELOG.md." \
            wheels/*.whl wheels/SHA256SUMS sbom.python.cdx.json sbom.rust.cdx.json \
            "rstest-$TAG.sigstore.json"
